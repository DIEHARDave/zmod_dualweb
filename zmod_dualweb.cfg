# zmod_dualweb: Fluidd and Mainsail at the same time.
#
# Zmod's interface stays on port 80 and the other one runs on port 81.
#
#   WEB              swap Fluidd and Mainsail between ports 80 and 81
#   DUALWEB          show which interface is on which port
#   DUALWEB STOP=1   stop the port 81 server until the next Klipper start

[gcode_shell_command zmod_dualweb]
command: /opt/config/mod_data/plugins/zmod_dualweb/dualweb.sh
timeout: 30
verbose: True

# Replaces Zmod's WEB (mod/base.cfg is included before mod_data/plugins.cfg).
[gcode_macro WEB]
description: Swap Fluidd and Mainsail between ports 80 and 81
gcode:
    {% set mute = params.MUTE|default(0)|int %}

    {% if mute == 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin Swap web interfaces"
        RESPOND TYPE=command MSG="action:prompt_text Fluidd and Mainsail will swap between ports 80 and 81. Afterwards press Ctrl + F5"
        RESPOND TYPE=command MSG="action:prompt_footer_button OK|WEB MUTE=1"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RUN_SHELL_COMMAND CMD=zhttp
        RUN_SHELL_COMMAND CMD=zmod_dualweb PARAMS=start
    {% endif %}

[gcode_macro DUALWEB]
description: Show which web interface is on ports 80 and 81
gcode:
    {% if params.STOP|default(0)|int %}
        RUN_SHELL_COMMAND CMD=zmod_dualweb PARAMS=stop
    {% else %}
        RUN_SHELL_COMMAND CMD=zmod_dualweb PARAMS=status
    {% endif %}

[delayed_gcode _DUALWEB_START]
initial_duration: 5
gcode:
    RUN_SHELL_COMMAND CMD=zmod_dualweb PARAMS=start
